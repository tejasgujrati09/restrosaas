[project]
name = "restosaas-api"
version = "0.1.0"
description = "QR ordering and billing API for Indian restaurants, bars and clubs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "segno>=1.6.6",
  "weasyprint>=70.0",
  "redis>=5.2",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "python-multipart>=0.0.32",
  "pypdfium2>=5.13.0",
  "pillow>=12.3.0",
  "boto3>=1.43.103",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "coverage>=7.6",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long SQL and CSV literals read better unsplit in tests.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["weasyprint.*", "celery.*", "boto3.*", "botocore.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
